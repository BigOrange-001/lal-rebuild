// Chaquopy ships from its own Maven repository; Android pieces come from Google.
buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://chaquo.com/maven' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.chaquo.python:gradle:17.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
