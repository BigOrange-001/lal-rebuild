<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英雄技能标定台 · 1.0.4</title>
<style>
:root{--ink:#262b32;--muted:#7a7b7b;--gold:#a67935;--line:#e4ded3;--paper:#fffdf8;--red:#a84234;--green:#33765a}*{box-sizing:border-box}body{margin:0;background:#f2eee6;color:var(--ink);font:15px/1.65 "Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:86px;background:#22282e;color:#ece5d7;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:25px;letter-spacing:2px;margin:0}header small{color:#b8aa91}header button{background:transparent;color:#f0dbb6;border:1px solid #76654b;border-radius:6px;padding:8px 15px;margin-left:8px}.shell{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1600px;margin:auto;height:calc(100vh - 86px)}aside{background:#f9f6ef;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.filters{padding:20px;border-bottom:1px solid var(--line)}input,select,textarea{width:100%;background:var(--paper);border:1px solid #d4cbbb;padding:9px;border-radius:6px;color:var(--ink)}.filters select{margin-top:8px}.filters label{font-size:13px;display:flex;align-items:center;gap:8px;margin-top:10px}.filters input[type=checkbox]{width:auto}.list{overflow:auto;padding:10px}.hero{width:100%;display:flex;align-items:center;text-align:left;gap:12px;border:1px solid transparent;background:transparent;padding:11px 10px;border-radius:8px;color:var(--ink);margin-bottom:4px}.hero:hover{background:#eee6d7}.hero.selected{background:#e9dfca;border-color:#c7ad7c}.avatar{width:40px;height:44px;display:grid;place-items:center;background:linear-gradient(140deg,#493c2b,#1e252d);color:#e6c789;border:2px solid #ad884e;border-radius:10px 10px 18px 18px;font-weight:bold;font-size:21px;flex-shrink:0}.hero small{color:var(--muted);font-size:11px}.badge{font-size:11px;padding:2px 7px;border-radius:4px;background:#eee6d8;color:#775c31;white-space:nowrap}.high{background:#f4ddd7;color:var(--red)}.medium{background:#f6ead0;color:#97631e}.low{background:#e4eaf0;color:#556b82}.main{overflow:auto;padding:28px 36px 80px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:13px 18px;background:var(--paper);border:1px solid var(--line);border-radius:8px}.metric strong{font-size:26px;font-family:Georgia,serif;display:block}.metric span{color:var(--muted);font-size:12px}.scope{font-size:12px;color:var(--muted);margin:15px 0 25px}.herohead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:20px 0}.herohead h2{margin:0;font-size:29px}.herohead select{width:145px}.sub{font-size:12px;color:var(--muted)}.section-title{font-size:12px;letter-spacing:2px;color:var(--gold);margin:26px 0 12px;font-weight:bold}.issue{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:20px;margin-bottom:12px}.issue h3{margin:8px 0;font-size:18px}.issue p{margin:8px 0;font-size:14px}.issue .suggest{padding:12px;background:#f2eee5;border-radius:5px;color:#5b5142}.decision{display:flex;gap:10px;margin-top:12px}.decision select{width:170px;flex-shrink:0}.decision textarea{min-height:44px;resize:vertical}.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.skill{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:18px}.skill h3{font-size:18px;margin:5px 0}.skill p{font-size:14px;white-space:pre-wrap;margin-bottom:8px}.timing{display:flex;gap:12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:10px}.skill:last-child:nth-child(odd){grid-column:1/-1}details{font-size:12px;color:#726653;margin-top:12px}summary{cursor:pointer;color:#82602e}pre{white-space:pre-wrap;word-break:break-word;background:#f2eee6;color:#555;padding:12px;font-size:11px;max-height:280px;overflow:auto}.context{background:#ebe5d9;padding:18px;border-radius:8px;font-size:13px}.context b{color:#6e4d25}.context p{margin:5px 0}.empty{padding:25px;color:var(--muted);border:1px dashed #cfc4af;border-radius:8px}.note{margin-top:20px}.note textarea{height:110px}.status{font-size:12px;color:#b9c9bc}.footer{display:flex;justify-content:space-between;margin-top:24px}.footer button{background:#343d43;color:#fff5df;border:0;border-radius:5px;padding:9px 20px}.saved{color:var(--green);font-size:12px}.count{font-size:12px;color:var(--muted);padding-top:10px}a{color:#9f7130}@media(max-width:900px){.shell{grid-template-columns:225px 1fr}.main{padding:20px}.summary{grid-template-columns:repeat(2,1fr)}.skills{grid-template-columns:1fr}.decision{flex-direction:column}.decision select{width:100%}}@media(max-width:620px){header{height:auto;padding:15px;display:block}header button{margin:8px 5px 0 0}.shell{height:auto;display:block}aside{max-height:360px}.main{overflow:visible}.herohead{align-items:flex-start}.herohead h2{font-size:24px}}
</style><header><div><small>LAL REBUILD / PLAYER REVIEW</small><h1>英雄技能标定台</h1></div><div><span class="status" id="saveState">核查记录保存在当前浏览器</span><button id="importBtn">导入核查</button><button id="exportBtn">导出核查记录 ↓</button><input id="file" type="file" accept="application/json" hidden></div></header>
<div class="shell"><aside><div class="filters"><input id="search" placeholder="搜索英雄、技能或问题…" aria-label="搜索"><select id="kind"><option value="">所有问题类型</option><option>逻辑</option><option>过强</option><option>偏弱</option><option>风味</option><option>联动</option><option>说明</option></select><select id="state"><option value="">所有核查状态</option><option>未核查</option><option>需要修改</option><option>保留现状</option><option>待实测</option><option>暂不处理</option></select><label><input id="flagged" type="checkbox" checked>只看有疑点的英雄</label><div class="count" id="count"></div></div><nav class="list" id="list"></nav></aside><main class="main" id="main"><div class="summary" id="summary"></div><p class="scope" id="scope"></p><div id="detail"></div></main></div>
<script id="data" type="application/json">__REVIEW_DATA__</script><script>
const DATA=JSON.parse(document.querySelector('#data').textContent),KEY='lal-skill-review-104-v1', $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}let active=null,quality=6,filtered=[];
const statuses=['未核查','需要修改','保留现状','待实测','暂不处理'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved));$('#saveState').textContent='已自动保存 · '+new Date().toLocaleTimeString()}catch{$('#saveState').textContent='浏览器无法保存，请立即导出记录'}}
function record(id){return saved[id]||{decisions:{},note:''}}
function heroState(h){const r=record(h.id),ss=Object.values(r.decisions||{}).map(x=>x.status);return ss.includes('需要修改')?'需要修改':ss.includes('待实测')?'待实测':ss.length&&ss.every(x=>x==='保留现状')?'保留现状':ss.includes('暂不处理')?'暂不处理':'未核查'}
$('#summary').innerHTML=[['英雄目录',DATA.summary.heroes],['品质卡形态',DATA.summary.cards],['技能条目',DATA.summary.skills],['有疑点的英雄',DATA.summary.flagged]].map(([t,n])=>`<div class="metric"><strong>${n}</strong><span>${t}</span></div>`).join('');$('#scope').textContent=DATA.version+'。'+DATA.scope;
function refresh(){const q=$('#search').value.trim().toLowerCase(),kind=$('#kind').value,state=$('#state').value;filtered=DATA.heroes.filter(h=>(!$('#flagged').checked||h.issues.length)&&(!kind||h.issues.some(i=>i.kind===kind))&&(!state||heroState(h)===state)&&(!q||JSON.stringify([h.name,h.variants.map(v=>v.skills.map(s=>s.name)),h.issues]).toLowerCase().includes(q)));filtered.sort((a,b)=>score(b)-score(a)||a.id.localeCompare(b.id));if(!filtered.some(h=>h.id===active))active=filtered[0]?.id;renderList();render()}
function score(h){return h.issues.some(i=>i.severity==='高')?3:h.issues.some(i=>i.severity==='中')?2:h.issues.length?1:0}
function renderList(){$('#count').textContent=`显示 ${filtered.length} / ${DATA.summary.heroes} 位英雄`;$('#list').innerHTML=filtered.map(h=>`<button class="hero ${h.id===active?'selected':''}" data-id="${h.id}"><span class="avatar">${esc(h.name[0])}</span><span style="flex:1"><b>${esc(h.name)}</b><br><small>${h.skin?'皮肤':'普通 / 同人'} · ${heroState(h)}</small></span><span class="badge ${score(h)===3?'high':''}">${h.issues.length||'—'}</span></button>`).join('');$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.id;quality=6;renderList();render();$('#main').scrollTop=0})}
function render(){const h=DATA.heroes.find(h=>h.id===active);if(!h){$('#detail').innerHTML='<div class="empty">没有符合筛选条件的英雄。</div>';return}const v=h.variants.find(v=>v.quality===quality)||h.variants.at(-1),r=record(h.id);quality=v.quality;
$('#detail').innerHTML=`<div class="herohead"><div><h2>${esc(h.name)} <span class="badge">${h.skin?'皮肤英雄':'普通 / 同人'}</span></h2><div class="sub">${esc(h.id)} · ${h.variants.length}种品质 · 基础技能 + 羁绊上下文</div></div><select id="quality" aria-label="品质">${h.variants.map(x=>`<option value="${x.quality}" ${x.quality===quality?'selected':''}>${['','灰','白','绿','蓝','紫','橙','红'][x.quality]||x.quality}卡形态</option>`).join('')}</select></div><div class="section-title">01 / 优先核查的疑点</div>${h.issues.length?h.issues.map((i,n)=>{const d=r.decisions?.[n]||{};return `<article class="issue"><span class="badge ${i.severity==='高'?'high':i.severity==='中'?'medium':'low'}">${i.severity}优先级 · ${esc(i.kind)}</span> <span class="sub">${esc(i.origin)} · 候选判断</span><h3>${esc(i.title)}</h3><p>${esc(i.evidence)}</p><p class="suggest"><b>建议核查：</b>${esc(i.proposal)}</p><div class="decision"><select data-decision="${n}" aria-label="核查结论">${statuses.map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select><textarea data-note="${n}" placeholder="你的判断、目标数值或修改方案…" aria-label="问题备注">${esc(d.note||'')}</textarea></div></article>`}).join(''):'<div class="empty">本轮未列出优先疑点，不代表已经过充分实战验证。可以在下方登记其他问题。</div>'}<div class="section-title">02 / 当前技能 · ${quality===6?'橙卡':quality+'阶'}形态</div><div class="skills">${v.skills.map(s=>`<article class="skill"><span class="badge">${s.slot} · 等级 ${s.level}</span><h3>${esc(s.name)}</h3><div class="timing"><span>准备 ${s.timing[0]??0} 回合</span><span>冷却 ${s.timing[1]??0} 回合</span></div><p>${esc(s.text)}</p><details><summary>核对实际执行参数</summary><pre>${esc(JSON.stringify({技能:s.id,动作:s.actions,触发条件:s.condition,...s.parameters},null,2))}</pre></details></article>`).join('')}</div><div class="section-title">03 / 羁绊上下文</div><div class="context"><b>英雄羁绊</b><p>${h.bonds.map(b=>esc(b.name)).join(' · ')||'无'}</p><details><summary>查看本英雄配置与装备强化</summary><pre>${esc(JSON.stringify({羁绊:h.bonds,装备:h.equipment},null,2))}</pre></details></div><div class="note"><div class="section-title">04 / 补充问题与整体标定</div><textarea id="heroNote" placeholder="记录未列出的问题，或整体修改方向…">${esc(r.note||'')}</textarea><p class="saved">修改仅记录到本浏览器，不会改动游戏。完成后导出 JSON，便于回到开发会话继续落实。</p></div><div class="footer"><button id="previous">← 上一位</button><span class="sub">${filtered.findIndex(x=>x.id===h.id)+1} / ${filtered.length}</span><button id="next">下一位 →</button></div>`;
$('#quality').onchange=e=>{quality=Number(e.target.value);render()};$('#heroNote').oninput=e=>{saved[h.id]={...record(h.id),name:h.name,note:e.target.value};save()};document.querySelectorAll('[data-decision],[data-note]').forEach(el=>el.onchange=()=>{const n=el.dataset.decision??el.dataset.note,base=record(h.id),decision=base.decisions?.[n]||{};saved[h.id]={...base,name:h.name,decisions:{...base.decisions,[n]:{...decision,title:h.issues[n].title,...(el.dataset.decision!==undefined?{status:el.value}:{note:el.value})}}};save();renderList()});$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1)}
function move(n){let i=filtered.findIndex(h=>h.id===active);if(filtered[i+n]){active=filtered[i+n].id;quality=6;renderList();render();$('#main').scrollTop=0}}
['search','kind','state','flagged'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',refresh));
$('#exportBtn').onclick=()=>{const payload={schema:'lal-hero-review-104-v1',version:DATA.version,exportedAt:new Date().toISOString(),reviews:saved};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='英雄技能标定-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const x=JSON.parse(await f.text());if(x.schema!=='lal-hero-review-104-v1'||!x.reviews||Array.isArray(x.reviews))throw Error('不是本标定台导出的文件');for(const [id,value] of Object.entries(x.reviews))if(DATA.heroes.some(h=>h.id===id)&&value&&typeof value==='object')saved[id]=value;save();refresh()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};refresh();
</script></html>
