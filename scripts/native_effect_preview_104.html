<!doctype html><html lang="zh"><meta charset="utf-8"><title>自制战斗特效 · 简化画风</title><style>
*{box-sizing:border-box}body{margin:0;background:#17212a;color:#f3deb7;font:15px "Microsoft Yahei",sans-serif}main{max-width:1240px;margin:30px auto;padding:0 22px}h1{font-size:28px}p{line-height:1.8;color:#b8c6ce}button,select{background:#92703e;border:1px solid #c7a36c;border-radius:5px;padding:9px 15px;color:white;margin:4px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:16px}article{background:#26303b;border:1px solid #796443;border-radius:7px;overflow:hidden}article h3{font-size:16px;margin:12px}canvas{width:100%;display:block}small{display:block;padding:10px;color:#a7b8c6}.sizes{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.sizes canvas{width:576px;max-width:100%;background:#1a2832}#modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:10}#modal.open{display:flex}#large{width:min(1000px,95vw);background:#1a2730}#close{float:right}header{position:sticky;top:0;background:#17212af5;padding:8px 0;z-index:2}
</style><main><h1>自制战斗特效 · 简化画风</h1><p>32 个新绘透明组件：大色块、少量亮芯、低细节轮廓。以下技能动画与持续状态全部使用新素材，没有原版特效贴图或骨架。动画通过弹道、旋转、展开、环绕和消散组成；人物站位仅为演示。</p><header><button id="pause">暂停 / 播放</button><button id="restart">重新播放</button><select id="speed"><option value="1">正常速度</option><option value=".5">半速</option><option value="2">双倍</option></select><select id="filter"><option value="all">全部</option><option value="skill">技能动画</option><option value="state">专属状态</option></select></header><h2>小尺寸检查</h2><p>上排约 48 像素，下排约 96 像素；先看实战尺寸的轮廓和亮度。</p><div class="sizes"><canvas id="sizes" width="576" height="160"></canvas></div><h2>技能动画与专属状态</h2><section id="grid" class="grid"></section></main><div id="modal"><div id="large"><button id="close">关闭</button><h3 id="title"></h3><canvas id="big" width="1000" height="650"></canvas></div></div>
<script id="payload" type="application/json">/*PAYLOAD*/</script><script>
const DATA=JSON.parse(document.querySelector('#payload').textContent),sheets=DATA.sheets.map(src=>{let i=new Image();i.src=src;return i}),profiles=/*PROFILES*/;
let running=true,clock=0,last=0,opened=null;const scenes=[];
for(const [key,p] of Object.entries(profiles))add(key,p,'skill');for(const [key,p] of Object.entries(DATA.states))add(key,p,'state');
function add(key,p,type){let a=document.createElement('article');a.dataset.type=type;a.innerHTML=`<h3>${p.name}</h3><canvas width="600" height="390"></canvas><small>${type==='state'?'持续状态：循环展示，结束时消散':'新绘素材 · 施法与命中动画'}</small>`;document.querySelector('#grid').append(a);let canvas=a.querySelector('canvas'),item={key,canvas,p,type};scenes.push(item);canvas.onclick=()=>{opened=item;document.querySelector('#title').textContent=p.name;document.querySelector('#modal').classList.add('open')};}
function sprite(ctx,id,x,y,scale=1,rotation=0,alpha=1,sy=scale){let n=+id.slice(1),im=sheets[Math.floor(n/16)];if(!im.complete||!im.naturalWidth)return;let size=im.width/4,k=n%16;ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.drawImage(im,(k%4)*size,Math.floor(k/4)*size,size,size,-48*scale,-48*sy,96*scale,96*sy);ctx.restore();}
function background(ctx,s){ctx.setTransform(s,0,0,s,0,0);ctx.fillStyle='#203239';ctx.fillRect(0,0,400,260);for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#293b40':'#26383d';ctx.fillRect(i*36-20,20+(i%2)*8,33,225);}for(const [j,pt] of [[80,140],[300,140]].entries()){ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(pt[0],pt[1]+24,28,9,0,0,7);ctx.fill();ctx.fillStyle=j?'#7c4540':'#3d637b';ctx.beginPath();ctx.arc(pt[0],pt[1]-13,13,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(pt[0]-20,pt[1]+20);ctx.quadraticCurveTo(pt[0]-23,pt[1]-3,pt[0],pt[1]-1);ctx.quadraticCurveTo(pt[0]+23,pt[1]-3,pt[0]+20,pt[1]+20);ctx.fill();ctx.fillStyle=j?'#d96550':'#5eb39c';ctx.fillRect(pt[0]-23,pt[1]-36,46,4);}}
function state(ctx,key,p,t){let fade=t<3.5?1:Math.max(0,1-(t-3.5)/.4);if(t>3.9)return;for(let i=0;i<p.ids.length;i++){let phase=t*2+i*2.094+.3,x=300,y=140,sc=.65,sy=sc,rot=0,alpha=.5;sc*=1+.06*Math.sin(phase);sy*=1+.08*Math.cos(phase);
 if(['crows','dance','phase','charge','windmark','sonic','airborne'].includes(key)){x+=Math.cos(phase)*30;y+=Math.sin(phase)*14;rot=phase+Math.PI/2;if(key==='crows'){sc*=.6;sy*=.6*(.8+.25*Math.sin(t*10+i));rot=Math.sin(phase)*.2;alpha=.7;}}
 else if(key==='awake'){rot=(i?-1:1)*t;alpha=.35+.12*Math.sin(phase);}
 else if(key==='shot'||key==='ball'){x+=Math.cos(phase)*19;y+=20+Math.sin(phase)*5;rot=t*2;}
 else if(key==='charmed'){rot=t*.65;alpha=.55+.12*Math.sin(phase);}
 else if(key==='exposed'){alpha=.3+.25*(1+Math.sin(t*4))*.5;rot=-.2;}
 else if(['growth','bear','command'].includes(key)){y+=18-Math.sin(phase)*9;alpha=.3+.16*Math.sin(phase);}
 else if(key==='guard'||key==='grey')alpha=.38+.12*Math.sin(phase);
 else if(key==='wanted'){x+=(i?1:-1)*(24+Math.sin(phase)*3);rot=i?Math.PI:0;sc*=.5;sy*=.5;}
 else if(key==='time'||key==='time_rings')rot=-t*.65;
 else if(key==='egg_ready'){rot=Math.sin(t*5)*.08;y+=Math.sin(t*3)*3;}
 if(key==='rings'||key==='time_rings'){sc*=.8+i*.2;sy*=.3+i*.08;y+=26;}
 if(key==='trap'||key==='time'){sy*=.45;y+=20;}
 if(key==='summon'){sy*=.35;y+=28;alpha=.25;rot=t*.2;}
 sprite(ctx,p.ids[i],x,y,sc,rot,alpha*fade,sy);
}}
function scene(cv,item,t){const ctx=cv.getContext('2d'),s=cv.width/400;background(ctx,s);if(item.type==='state'){state(ctx,item.key,item.p,t%4.8);return;}t%=2.2;for(const p of item.p.parts){let age=t-p.delay;if(age<0||age>p.life)continue;let progress=age/p.life,x=p.at==='source'?80:300,y=140,rotation=p.rotation||0,scale=p.scale;if(p.at==='flight')x=80+220*progress;else scale*=.35+.65*(1-Math.pow(1-Math.min(1,age/Math.min(.18,p.life*.4)),2));rotation+=(p.spin||0)*age;y+=(p.rise||0)*progress;let alpha=age>p.life-.14?(p.life-age)/.14:1;sprite(ctx,p.id,x,y,scale,rotation,alpha);}}
function frame(now){if(last&&running)clock+=(now-last)/1000*+document.querySelector('#speed').value;last=now;for(const i of scenes){let r=i.canvas.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)scene(i.canvas,i,clock);}if(opened)scene(document.querySelector('#big'),opened,clock);requestAnimationFrame(frame)}requestAnimationFrame(frame);
function sizeCheck(){let c=document.querySelector('#sizes').getContext('2d');c.clearRect(0,0,576,160);[0,9,16,18,20,21].forEach((n,i)=>{sprite(c,'c'+n,48+i*96,30,.5);sprite(c,'c'+n,48+i*96,110,1)})}Promise.all(sheets.map(i=>i.decode())).then(sizeCheck);
window.previewAt=t=>{running=false;clock=t;scenes.forEach(i=>scene(i.canvas,i,t));sizeCheck()};document.querySelector('#pause').onclick=()=>running=!running;document.querySelector('#restart').onclick=()=>clock=0;document.querySelector('#close').onclick=()=>{opened=null;document.querySelector('#modal').classList.remove('open')};document.querySelector('#filter').onchange=e=>document.querySelectorAll('article').forEach(a=>a.style.display=e.target.value==='all'||a.dataset.type===e.target.value?'':'none');
</script></html>
